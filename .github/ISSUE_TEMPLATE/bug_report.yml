name: Bug report
description: Report a bug in LPCF
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software and Minecraft version
      placeholder: "Paper 1.21.4 / Folia 26.2"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
