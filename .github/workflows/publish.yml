# Publish LPCF to Modrinth + CurseForge on version tags.
#
# Secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN, CURSEFORGE_API_KEY
# Variables: MODRINTH_ID (cq7XqCTD), CURSEFORGE_ID
#
#   git tag v1.2.0 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Find jars
        id: jars
        shell: bash
        run: |
          mapfile -t JARS < <(find ./build/libs -type f -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" | head -n 20)
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No jars in build/libs" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          const loaders = ['paper', 'folia', 'purpur'];
          const gvs = [
            '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
            '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5',
            '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11',
            '26.1', '26.1.1', '26.1.2', '26.2'
          ];

          (async () => {
            const fileParts = jars.map((_, i) => `file_${i}`);
            const body = {
              name: version,
              version_number: version,
              changelog: `Release ${version}`,
              dependencies: [],
              game_versions: gvs,
              version_type: 'release',
              loaders,
              featured: false,
              status: 'listed',
              project_id: process.env.MODRINTH_ID,
              file_parts: fileParts,
              primary_file: fileParts[0],
            };
            const form = new FormData();
            form.append('data', JSON.stringify(body));
            for (let i = 0; i < jars.length; i++) {
              form.append(fileParts[i], new Blob([fs.readFileSync(jars[i])]), path.basename(jars[i]));
            }
            const mrRes = await fetch('https://api.modrinth.com/v2/version', {
              method: 'POST',
              headers: { Authorization: process.env.MODRINTH_TOKEN },
              body: form,
            });
            const mrText = await mrRes.text();
            if (!mrRes.ok) {
              const already = mrRes.status === 409 || /already exists|duplicate/i.test(mrText);
              if (!already) throw new Error('Modrinth ' + mrRes.status + ' ' + mrText.slice(0, 500));
              console.log('Modrinth version already exists; continuing to CurseForge');
            } else {
              console.log('Modrinth OK', mrText.slice(0, 180));
            }

            const mcRes = await fetch('https://api.curseforge.com/v1/minecraft/versions', {
              headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
            });
            const mcText = await mcRes.text();
            if (!mcRes.ok) throw new Error('CurseForge versions ' + mcRes.status + ' ' + mcText.slice(0, 500));
            const mcJson = JSON.parse(mcText);
            const mcList = mcJson.data || [];
            const gameVersionIds = [];
            for (const want of gvs) {
              const hit = mcList.find((v) => v.versionString === want || v.name === want);
              if (hit) gameVersionIds.push(hit.gameVersionId || hit.id);
              else console.warn('No CF Minecraft version for ' + want + ' (skipped)');
            }

            const typeRes = await fetch('https://api.curseforge.com/v1/games/432/versions', {
              headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
            });
            const typeJson = await typeRes.json();
            const typed = [];
            for (const g of typeJson.data || []) for (const v of g.versions || []) typed.push(v);
            for (const loaderName of ['Bukkit', 'Paper', 'Spigot', 'Folia', 'Purpur']) {
              const hit = typed.find((v) => v.name === loaderName);
              if (hit && !gameVersionIds.includes(hit.id)) gameVersionIds.push(hit.id);
            }

            if (!gameVersionIds.length) throw new Error('No CurseForge game versions resolved');
            console.log('CF gameVersionIds count', gameVersionIds.length);

            for (const jar of jars) {
              const meta = {
                changelog: `Release ${version}`,
                changelogType: 'markdown',
                displayName: path.basename(jar),
                gameVersions: gameVersionIds,
                releaseType: 1,
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', path.basename(jar), cfText.slice(0, 180));
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
