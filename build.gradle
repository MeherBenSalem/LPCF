plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'io.nightbeam'
version = file('VERSION').text.trim()

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:$paper"
    compileOnly "net.luckperms:api:$luckpermsapi"
    compileOnly "me.clip:placeholderapi:$papi"
    implementation 'org.bstats:bstats-bukkit:3.1.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "io.papermc.paper:paper-api:$paper"
    testImplementation "net.luckperms:api:$luckpermsapi"
}

shadowJar {
    archiveBaseName.set('LPCF')
    archiveVersion.set(version)
    archiveClassifier.set('')
    relocate 'org.bstats', 'io.nightbeam.LPCF.libs.bstats'

    from('LICENSE') {
        into 'META-INF'
    }
    from('NOTICE') {
        into 'META-INF'
    }
}

// QA only: a helper plugin used by tools/qa (never part of the release jar).
sourceSets {
    qa {
        compileClasspath += sourceSets.main.compileClasspath
    }
}

tasks.register('qaHelperJar', Jar) {
    from sourceSets.qa.output
    archiveFileName.set('LPCF-QA-Helper.jar')
    destinationDirectory.set(layout.buildDirectory.dir('qa'))
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('test') {
    useJUnitPlatform()
}

// Java 17 bytecode: 1.20.1 servers run on Java 17. Any JDK 17 or newer can build it.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
    options.compilerArgs << '-Xlint:deprecation'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
